# 奕派车辆状态仪表盘（小米汽车卡片风格）
# 前提：dongfeng_yipai 集成 v0.4.3+ 已安装，卡片资源已由集成自动注册
# 用法：HA → 设置 → 仪表盘 → 添加视图 → 手动 YAML，粘贴下面 cards: 之后的内容

title: 奕派车库
path: /dongfeng-yipai
icon: mdi:car-electric
cards:
  - type: custom:epi-hero-card

  - type: grid
    columns: 2
    card: false
    square: false
    cards:
      - type: custom:epi-charge-card
      - type: custom:epi-tyres-card

  - type: custom:epi-actions-card

  - type: custom:epi-loc-card
